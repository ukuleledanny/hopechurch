<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events · Hope Church Madison</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ── Calendar shell ── */
    .cal {
      background: var(--surface);
      border: 1px solid rgba(54,65,87,0.08);
      border-radius: var(--r-card);
      overflow: hidden;
    }
    .cal__toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid rgba(54,65,87,0.08);
    }
    .cal__title { font-size: 1.5rem; margin: 0; }
    .cal__nav { display: flex; gap: 0.5rem; }
    .cal__btn {
      font-family: 'Work Sans', sans-serif;
      font-size: 0.9rem; font-weight: 500;
      min-width: 40px; height: 40px;
      padding: 0 0.9rem;
      border: 1px solid rgba(54,65,87,0.18);
      border-radius: var(--r-btn);
      background: var(--surface);
      color: var(--text-primary);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .cal__btn:hover:not(:disabled) { background: var(--surface-lt); border-color: var(--periwinkle); }
    .cal__btn:disabled { opacity: 0.35; cursor: default; }

    /* ── Month grid ── */
    .cal__weekdays, .cal__grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }
    .cal__weekdays div {
      padding: 0.6rem 0.75rem;
      font-size: 0.78rem; font-weight: 500;
      color: var(--slate-mid);
      text-align: left;
      background: var(--surface-lt);
      border-bottom: 1px solid rgba(54,65,87,0.08);
    }
    .cal__day {
      min-height: 120px;
      padding: 0.5rem;
      border-right: 1px solid rgba(54,65,87,0.08);
      border-bottom: 1px solid rgba(54,65,87,0.08);
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .cal__day:nth-child(7n) { border-right: none; }
    .cal__day--out { background: rgba(237,240,244,0.45); }
    .cal__day--out .cal__date { color: var(--text-muted); opacity: 0.6; }
    .cal__date {
      font-size: 0.85rem; font-weight: 500;
      color: var(--text-primary);
      width: 26px; height: 26px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%;
      margin-bottom: 2px;
    }
    .cal__day--today .cal__date { background: var(--navy); color: var(--white); }

    .cal__event {
      display: block;
      width: 100%;
      text-align: left;
      font-family: 'Work Sans', sans-serif;
      font-size: 0.78rem;
      line-height: 1.3;
      padding: 3px 6px;
      border: none;
      border-left: 3px solid var(--periwinkle);
      border-radius: var(--r-tag);
      background: rgba(124,157,209,0.14);
      color: var(--text-primary);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.2s;
    }
    .cal__event:hover, .cal__event:focus-visible { background: rgba(124,157,209,0.28); outline: none; }
    .cal__event time { font-weight: 500; color: var(--slate-mid); margin-right: 4px; }
    .cal__event--allday { background: var(--slate); border-left-color: var(--navy); color: var(--white); }
    .cal__event--allday:hover { background: var(--navy); }

    .cal__status {
      padding: 4rem 2rem;
      text-align: center;
      color: var(--text-body);
    }

    /* ── Agenda (phones) ── */
    .cal__agenda { display: none; list-style: none; }
    .agenda__day {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid rgba(54,65,87,0.08);
    }
    .agenda__day:last-child { border-bottom: none; }
    .agenda__date { text-align: center; line-height: 1.1; }
    .agenda__dow { font-size: 0.72rem; font-weight: 500; color: var(--slate-mid); text-transform: uppercase; }
    .agenda__num { font-family: 'Source Sans 3', sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--text-primary); }
    .agenda__events { display: flex; flex-direction: column; gap: 0.5rem; min-width: 0; }
    .agenda__events .cal__event { white-space: normal; padding: 0.5rem 0.75rem; font-size: 0.9rem; }
    .agenda__events .cal__event time { display: block; margin: 0 0 2px; }
    .agenda__empty { padding: 3rem 1.5rem; text-align: center; color: var(--text-body); }

    @media (max-width: 760px) {
      .cal__weekdays, .cal__grid { display: none; }
      .cal__agenda { display: block; }
      .cal__toolbar { padding: 1rem; }
      .cal__title { font-size: 1.25rem; }
    }

    /* ── Event detail dialog ── */
    .event-dialog {
      border: none;
      border-radius: var(--r-card);
      padding: 0;
      width: min(520px, calc(100% - 2rem));
      margin: auto;
      box-shadow: 0 24px 60px rgba(15,20,30,0.3);
      color: var(--text-primary);
    }
    .event-dialog::backdrop { background: rgba(30,37,51,0.55); }
    .event-dialog__bar { height: 4px; background: var(--periwinkle); }
    .event-dialog__body { padding: 2rem; }
    .event-dialog__close {
      position: absolute; top: 0.85rem; right: 0.85rem;
      width: 36px; height: 36px;
      border: none; border-radius: 50%;
      background: transparent; color: var(--slate-mid);
      font-size: 1.5rem; line-height: 1; cursor: pointer;
    }
    .event-dialog__close:hover { background: var(--surface-lt); }
    .event-dialog h3 { margin: 0 2rem 1rem 0; }
    .event-dialog__meta { list-style: none; margin-bottom: 1.25rem; }
    .event-dialog__meta li { font-size: 0.95rem; color: var(--text-body); padding: 2px 0; }
    .event-dialog__meta strong { color: var(--text-primary); font-weight: 500; margin-right: 0.35rem; }
    .event-dialog__summary { white-space: pre-line; margin-bottom: 1.5rem; }
  </style>
</head>
<body>

<div id="nav-placeholder"></div>

<!-- ── Page Hero ── -->
<section class="page-hero">
  <div class="container">
    <span class="eyebrow">What's Coming Up</span>
    <h1>Events</h1>
    <p>From Sunday mornings to community nights — here's what's happening at Hope.</p>
  </div>
</section>

<!-- ── Calendar ── -->
<section class="section section--warm">
  <div class="container">
    <!-- Filled in from Planning Center by the script below -->
    <div class="cal" id="cal">
      <div class="cal__toolbar">
        <h2 class="cal__title" id="calTitle">&nbsp;</h2>
        <div class="cal__nav">
          <button class="cal__btn" id="calPrev" aria-label="Previous month">&lsaquo;</button>
          <button class="cal__btn" id="calToday">Today</button>
          <button class="cal__btn" id="calNext" aria-label="Next month">&rsaquo;</button>
        </div>
      </div>
      <div class="cal__weekdays" aria-hidden="true">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="cal__grid" id="calGrid" aria-live="polite"></div>
      <ul class="cal__agenda" id="calAgenda" aria-live="polite"></ul>
      <div class="cal__status" id="calStatus">Loading events&hellip;</div>
    </div>
  </div>
</section>

<dialog class="event-dialog" id="eventDialog" aria-labelledby="eventDialogTitle">
  <div class="event-dialog__bar"></div>
  <button class="event-dialog__close" id="eventDialogClose" aria-label="Close">&times;</button>
  <div class="event-dialog__body">
    <h3 id="eventDialogTitle"></h3>
    <ul class="event-dialog__meta" id="eventDialogMeta"></ul>
    <p class="event-dialog__summary" id="eventDialogSummary"></p>
    <a class="btn btn--solid" id="eventDialogLink" target="_blank" rel="noopener">View Details &rarr;</a>
  </div>
</dialog>

<div id="footer-placeholder"></div>
<script src="shared.js"></script>
<script>
  const TZ = 'America/Chicago';
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  const $ = (id) => document.getElementById(id);
  const grid = $('calGrid'), agenda = $('calAgenda'), status = $('calStatus');
  const dialog = $('eventDialog');

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // "YYYY-MM-DD" for a moment, in church local time
  const dayKey = (d) => d.toLocaleDateString('en-CA', { timeZone: TZ });
  const keyOf = (y, m, d) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  const fmtTime = (d) => d.toLocaleTimeString('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).replace(':00', '');

  function timeRange(ev) {
    if (ev.all_day) return 'All day';
    const start = new Date(ev.starts_at);
    return ev.ends_at ? fmtTime(start) + ' – ' + fmtTime(new Date(ev.ends_at)) : fmtTime(start);
  }

  // Map of dayKey -> events (multi-day events appear on every day they span)
  const byDay = new Map();
  function index(events) {
    for (const ev of events) {
      const start = new Date(ev.starts_at);
      const end = ev.ends_at ? new Date(new Date(ev.ends_at).getTime() - 60000) : start;
      const cursor = new Date(start);
      for (let i = 0; i < 31 && dayKey(cursor) <= dayKey(end); i++) {
        const k = dayKey(cursor);
        if (!byDay.has(k)) byDay.set(k, []);
        byDay.get(k).push(ev);
        cursor.setTime(cursor.getTime() + 86400000);
      }
    }
  }

  function eventButton(ev) {
    const b = el('button', 'cal__event' + (ev.all_day ? ' cal__event--allday' : ''));
    b.type = 'button';
    if (!ev.all_day) b.appendChild(el('time', '', fmtTime(new Date(ev.starts_at))));
    b.appendChild(document.createTextNode(ev.name));
    b.title = ev.name;
    b.addEventListener('click', () => openEvent(ev));
    return b;
  }

  function openEvent(ev) {
    const start = new Date(ev.starts_at);
    $('eventDialogTitle').textContent = ev.name;
    const meta = $('eventDialogMeta');
    meta.textContent = '';
    const rows = [
      ['Date', start.toLocaleDateString('en-US', { timeZone: TZ, weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })],
      ['Time', timeRange(ev)],
      ['Where', ev.location],
    ];
    for (const [label, value] of rows) {
      if (!value) continue;
      const li = el('li');
      li.appendChild(el('strong', '', label));
      li.appendChild(document.createTextNode(value));
      meta.appendChild(li);
    }
    $('eventDialogSummary').textContent = ev.summary || '';
    $('eventDialogSummary').hidden = !ev.summary;
    const link = $('eventDialogLink');
    const ok = ev.url && /^https:\/\//.test(ev.url);
    link.hidden = !ok;
    if (ok) link.href = ev.url;
    dialog.showModal();
  }
  $('eventDialogClose').addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', (e) => { if (e.target === dialog) dialog.close(); });

  const now = new Date();
  const todayKey = dayKey(now);
  const [ty, tm] = todayKey.split('-').map(Number);
  const minMonth = ty * 12 + (tm - 1);
  let maxMonth = minMonth;
  let view = minMonth;
  let loaded = false;

  function render() {
    const y = Math.floor(view / 12), m = view % 12;
    $('calTitle').textContent = `${MONTHS[m]} ${y}`;
    $('calPrev').disabled = view <= minMonth;
    $('calNext').disabled = view >= maxMonth;
    $('calToday').disabled = view === minMonth;

    // Month grid: always whole weeks, Sunday first
    grid.textContent = '';
    const firstDow = new Date(Date.UTC(y, m, 1)).getUTCDay();
    const daysIn = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    const cells = Math.ceil((firstDow + daysIn) / 7) * 7;
    for (let i = 0; i < cells; i++) {
      const d = new Date(Date.UTC(y, m, 1 - firstDow + i));
      const k = keyOf(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
      const cell = el('div', 'cal__day');
      if (d.getUTCMonth() !== m) cell.classList.add('cal__day--out');
      if (k === todayKey) cell.classList.add('cal__day--today');
      cell.appendChild(el('span', 'cal__date', String(d.getUTCDate())));
      (byDay.get(k) || []).forEach((ev) => cell.appendChild(eventButton(ev)));
      grid.appendChild(cell);
    }

    // Agenda: only days in this month that have events
    agenda.textContent = '';
    for (let d = 1; d <= daysIn; d++) {
      const k = keyOf(y, m, d);
      const list = byDay.get(k);
      if (!list) continue;
      const li = el('li', 'agenda__day');
      const date = el('div', 'agenda__date');
      const dt = new Date(Date.UTC(y, m, d));
      date.appendChild(el('div', 'agenda__dow', dt.toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'short' })));
      date.appendChild(el('div', 'agenda__num', String(d)));
      const evs = el('div', 'agenda__events');
      list.forEach((ev) => evs.appendChild(eventButton(ev)));
      li.append(date, evs);
      agenda.appendChild(li);
    }
    if (loaded && !agenda.children.length) agenda.appendChild(el('li', 'agenda__empty', 'No events this month.'));
  }

  $('calPrev').addEventListener('click', () => { view--; render(); });
  $('calNext').addEventListener('click', () => { view++; render(); });
  $('calToday').addEventListener('click', () => { view = minMonth; render(); });

  async function loadEvents() {
    try {
      const res = await fetch('/api/events');
      if (!res.ok) throw new Error('bad response');
      const data = await res.json();
      const events = (data.events || []).filter((e) => e.starts_at);
      index(events);
      for (const k of byDay.keys()) {
        const [y, mo] = k.split('-').map(Number);
        maxMonth = Math.max(maxMonth, y * 12 + (mo - 1));
      }
      loaded = true;
      status.hidden = true;
      if (!events.length) {
        status.textContent = 'No upcoming events right now. Check back soon!';
        status.hidden = false;
      }
    } catch (err) {
      status.textContent = "We couldn't load events just now. Please try again in a few minutes.";
      status.hidden = false;
    }
    render();
  }

  render();
  loadEvents();
</script>
</body>
</html>
